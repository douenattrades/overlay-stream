<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Semana Trading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --verde: #22c55e;
    --rojo: #ef4444;
    --linea: rgba(255,255,255,0.18);
    --suave: rgba(255,255,255,0.5);
  }
  html, body { margin: 0; background: transparent; }
  body { font-family: "Inter", "Segoe UI", Arial, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  .panel {
    position: fixed; left: 24px; bottom: 24px;
    transform-origin: bottom left;
    display: inline-flex; align-items: center; gap: 14px;
    padding: 10px 14px;
    background: rgba(10,10,12,0.72);
    border-radius: 11px;
  }
  .dias { display: flex; gap: 7px; }
  .dia { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .circulo {
    width: 30px; height: 30px; border-radius: 50%; box-sizing: border-box;
    display: grid; place-items: center;
    font-size: 12px; font-weight: 600; color: var(--suave);
    border: 1.5px solid var(--linea);
    transition: background-color .4s, border-color .4s, color .4s;
  }
  .circulo.pos { background: var(--verde); border-color: var(--verde); color: #fff; }
  .circulo.neg { background: var(--rojo); border-color: var(--rojo); color: #fff; }
  .circulo.cero { background: rgba(255,255,255,0.2); border-color: transparent; color: #fff; }
  .hoy .circulo:not(.pos):not(.neg):not(.cero) { border-color: #fff; color: #fff; }
  .cantidad { font-size: 9px; font-weight: 600; color: var(--suave); font-variant-numeric: tabular-nums; height: 11px; }
  .cantidad.pos { color: var(--verde); } .cantidad.neg { color: var(--rojo); }
  .separador { width: 1px; align-self: stretch; background: var(--linea); }
  .stats { display: flex; flex-direction: column; gap: 5px; min-width: 66px; }
  .stat { display: flex; flex-direction: column; gap: 1px; }
  .etiqueta { font-size: 8px; font-weight: 600; letter-spacing: 0.1em; color: var(--suave); }
  .valor { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .pos { color: var(--verde); } .neg { color: var(--rojo); }
</style>
</head>
<body>
  <div class="panel">
    <div class="dias" id="dias"></div>
    <div class="separador"></div>
    <div class="stats">
      <div class="stat"><span class="etiqueta">SEMANA</span><span class="valor" id="total">–</span></div>
      <div class="stat"><span class="etiqueta">WINRATE</span><span class="valor" id="winrate">–</span></div>
    </div>
  </div>
<script>
  // Opciones por URL:
  //   ?canal=tucanal        nombre del canal de Kick (para escuchar !pnl en el chat)
  //   &chatroom=123456      id del chat de Kick (si no se puede sacar solo)
  const params = new URLSearchParams(location.search);
  // Tamaño y altura desde la URL: &tam=1.5 (1 = normal) y &alto=120 (píxeles desde abajo)
  const panel = document.querySelector(".panel");
  panel.style.transform = `scale(${Number(params.get("tam")) || 2.2})`;
  panel.style.bottom = (params.has("alto") ? Number(params.get("alto")) : 220) + "px";
  panel.style.left = (params.has("izq") ? Number(params.get("izq")) : 30) + "px";
  const CANAL = (params.get("canal") || "").toLowerCase();

  const DIAS = [
    { clave: "lunes", letra: "L" },
    { clave: "martes", letra: "M" },
    { clave: "miercoles", letra: "X" },
    { clave: "jueves", letra: "J" },
    { clave: "viernes", letra: "V" },
  ];
  const LETRA_A_DIA = { l: "lunes", m: "martes", x: "miercoles", j: "jueves", v: "viernes" };

  // Lunes de la semana actual en formato AAAA-MM-DD (hora local)
  function lunesDeEstaSemana() {
    const d = new Date();
    d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  }
  const claveLocal = () => "semana-" + lunesDeEstaSemana();

  let base = {};     // lo que hay en datos.json (lo actualizo yo desde GitHub)
  let chat = {};     // lo que mandas por el chat con !pnl (tiene prioridad)
  try { chat = JSON.parse(localStorage.getItem(claveLocal())) || {}; } catch (e) {}
  const guardarChat = () => { try { localStorage.setItem(claveLocal(), JSON.stringify(chat)); } catch (e) {} };

  const fmt = n => (n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(n).toLocaleString("es-ES") + "$";
  const signo = n => n > 0 ? "pos" : n < 0 ? "neg" : "";

  function pintar() {
    const hoy = new Date().getDay();
    let total = 0, ganados = 0, perdidos = 0, alguno = false;
    const cont = document.getElementById("dias");
    cont.innerHTML = "";
    DIAS.forEach((d, i) => {
      const valor = d.clave in chat ? chat[d.clave] : base[d.clave];
      let clase = "", texto = "";
      if (typeof valor === "number" && !isNaN(valor)) {
        alguno = true; total += valor; texto = fmt(valor);
        clase = signo(valor) || "cero";
        if (valor > 0) ganados++; else if (valor < 0) perdidos++;
      }
      const dia = document.createElement("div");
      dia.className = "dia" + (hoy === i + 1 ? " hoy" : "");
      dia.innerHTML = `<div class="circulo ${clase}">${d.letra}</div><span class="cantidad ${clase}">${texto}</span>`;
      cont.appendChild(dia);
    });
    const t = document.getElementById("total");
    t.textContent = alguno ? fmt(total) : "–";
    t.className = "valor " + (alguno ? signo(total) : "");
    const w = document.getElementById("winrate");
    const jugados = ganados + perdidos;
    const wr = jugados ? Math.round(ganados / jugados * 100) : 0;
    w.textContent = jugados ? wr + "%" : "–";
    w.className = "valor " + (jugados ? (wr >= 50 ? "pos" : "neg") : "");
  }

  async function cargarBase() {
    try {
      const r = await fetch("datos.json?t=" + Date.now(), { cache: "no-store" });
      const j = await r.json();
      base = j.semana === lunesDeEstaSemana() ? (j.dias || {}) : {};
    } catch (e) {}
    pintar();
  }

  // Comandos del chat:
  //   !pnl -300       pone el resultado de HOY en -300
  //   !pnl x -1000    pone el resultado del miércoles (l m x j v)
  //   !trade +150     suma +150 al resultado de hoy
  //   !pnl borrar     borra el resultado de hoy
  //   !pnl reset      borra todo lo puesto por chat esta semana
  function comando(texto) {
    const p = texto.trim().toLowerCase().split(/\s+/);
    if (p[0] !== "!pnl" && p[0] !== "!trade") return;
    const hoyClave = DIAS[new Date().getDay() - 1]?.clave;
    let dia = hoyClave, arg = p[1];
    if (LETRA_A_DIA[p[1]] && p.length > 2) { dia = LETRA_A_DIA[p[1]]; arg = p[2]; }
    if (p[0] === "!pnl" && arg === "reset") { chat = {}; guardarChat(); pintar(); return; }
    if (!dia) return; // fin de semana
    if (p[0] === "!pnl" && arg === "borrar") { chat[dia] = null; guardarChat(); pintar(); return; }
    const n = Number(String(arg).replace(/[$,]/g, "").replace("−", "-"));
    if (isNaN(n)) return;
    if (p[0] === "!trade") {
      const actual = dia in chat ? chat[dia] : base[dia];
      chat[dia] = (typeof actual === "number" ? actual : 0) + n;
    } else {
      chat[dia] = n;
    }
    guardarChat(); pintar();
  }
  window.probarComando = comando; // para probar sin el chat

  function puedeMandar(sender) {
    const badges = (sender?.identity?.badges || []).map(b => b.type);
    return (sender?.slug || "").toLowerCase() === CANAL || badges.includes("broadcaster") || badges.includes("moderator");
  }

  // Kick dejó el chat de Pusher: se leen los últimos mensajes del chat por su API cada 4 s.
  // Cada mensaje se aplica una sola vez (ids guardados), así !trade no suma dos veces al recargar.
  const CANAL_ID = params.get("canalid") || "134480495";
  let hechos = new Set();
  try { hechos = new Set(JSON.parse(localStorage.getItem("hechos")) || []); } catch (e) {}
  const guardarHechos = () => { try { localStorage.setItem("hechos", JSON.stringify([...hechos].slice(-500))); } catch (e) {} };
  const hoyTxt = () => new Date().toDateString();

  async function leerChat() {
    try {
      const r = await fetch(`https://kick.com/api/v2/channels/${CANAL_ID}/messages`, { cache: "no-store" });
      const msgs = (await r.json()).data.messages || [];
      msgs.slice().reverse().forEach(m => {  // del más antiguo al más nuevo
        if (hechos.has(m.id)) return;
        hechos.add(m.id);
        if (new Date(m.created_at).toDateString() !== hoyTxt()) return;
        if (puedeMandar(m.sender)) comando(m.content || "");
      });
      guardarHechos();
    } catch (e) {}
  }

  cargarBase();
  setInterval(cargarBase, 60000);
  leerChat();
  setInterval(leerChat, 4000);
</script>
</body>
</html>
